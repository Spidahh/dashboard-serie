<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Dashboard Serie</title>
<meta name="description" content="Gli episodi usciti che non hai ancora visto, presi dai tuoi account. Anime, serie TV e film, ognuno col suo spazio.">
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<!-- Il numero di versione sale a ogni modifica: senza, il browser continua a
     servire i file vecchi. Va cambiato in tutte le pagine e nella costante
     VERSIONE di sw.js. Se ne resta indietro uno, il sito lo dice nella console. -->
<link rel="stylesheet" href="app.css?v=23">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner topbar-row">
    <a class="marchio" href="index.html">
      <img src="icon.svg" alt="" width="26" height="26">
      <span data-t="app.nome"></span>
    </a>
    <nav class="spazi">
      <a href="anime.html" data-spazio="anime" data-t="nav.anime"></a>
      <a href="serie.html" data-spazio="serie" data-t="nav.serie"></a>
      <a href="film.html" data-spazio="film" data-t="nav.film"></a>
    </nav>
    <span class="spacer"></span>
    <span id="syncInfo" class="sync-info"></span>
    <button id="btnSync" class="icon-btn hidden" data-t-attr="title:ctrl.aggiorna">&#8635;</button>
    <span class="lingua-switch">
      <button data-lingua="it">IT</button><button data-lingua="en">EN</button>
    </span>
    <a class="icon-btn" href="impostazioni.html" data-t-attr="title:nav.impostazioni">&#9881;</a>
  </div>
</header>

<main class="pagina-centro">

  <!-- ============ APERTURA ============ -->
  <section class="hero">
    <h1 data-t="home.titolo"></h1>
    <p class="hero-sotto" data-t="home.sotto"></p>
    <p class="hero-sotto hero-sotto2" data-t="home.sotto2"></p>

    <div id="heroAzioni" class="hero-azioni"></div>
  </section>

  <!-- ============ I TRE SPAZI ============ -->
  <section class="sezione" id="sezSpazi">
    <h2 class="sezione-t" data-t="home.spaziTitolo"></h2>
    <p class="sezione-d" data-t="home.spaziSotto"></p>
    <div class="spazi-carte" id="spaziCarte"></div>
  </section>

  <!-- ============ SERVIZI ============ -->
  <section class="sezione">
    <h2 class="sezione-t" data-t="home.serviziTitolo"></h2>
    <p class="sezione-d" data-t="home.serviziSotto"></p>
    <div class="servizi" id="homeServizi"></div>
  </section>

  <!-- ============ COME FUNZIONA ============ -->
  <section class="sezione">
    <h2 class="sezione-t" data-t="home.comeFunziona"></h2>
    <div class="punti">
      <div class="punto">
        <h3 data-t="home.p1t"></h3>
        <p data-t="home.p1d"></p>
      </div>
      <div class="punto">
        <h3 data-t="home.p2t"></h3>
        <p data-t="home.p2d"></p>
      </div>
      <div class="punto">
        <h3 data-t="home.p3t"></h3>
        <p data-t="home.p3d"></p>
      </div>
    </div>
    <p class="sezione-d">
      <a href="guida.html" data-t="home.leggiGuida"></a>
    </p>
  </section>

</main>

<script src="js/lingua.js?v=23"></script>
<script src="js/stato.js?v=23"></script>
<script src="js/fonti.js?v=23"></script>
<script src="js/regole.js?v=23"></script>
<script src="js/carte.js?v=23"></script>
<script src="js/telaio.js?v=23"></script>
<script src="js/home.js?v=23"></script>
</body>
</html>
