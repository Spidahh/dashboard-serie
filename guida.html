<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Guida · Dashboard Serie</title>
<meta name="description" content="Tre passaggi, una volta sola: un account che segna cosa guardi, e lo colleghi qui.">
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<!-- il numero di versione va tenuto uguale in tutte le pagine e in sw.js -->
<link rel="stylesheet" href="app.css?v=28">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner topbar-row">
    <a class="marchio" href="index.html">
      <img src="icon.svg" alt="" width="26" height="26">
      <span data-t="app.nome"></span>
    </a>
    <nav class="spazi">
      <a href="anime.html" data-spazio="anime" data-t="nav.anime"></a>
      <a href="serie.html" data-spazio="serie" data-t="nav.serie"></a>
      <a href="film.html" data-spazio="film" data-t="nav.film"></a>
    </nav>
    <span class="spacer"></span>
    <span class="lingua-switch">
      <button data-lingua="it">IT</button><button data-lingua="en">EN</button>
    </span>
    <a class="icon-btn" href="impostazioni.html" data-t-attr="title:nav.impostazioni">&#9881;</a>
  </div>
</header>

<!--
  La guida di prima era un muro: giusta, ma nessuno la leggeva fino in fondo.
  Adesso in pagina resta il minimo indispensabile — una riga di riassunto e tre
  passaggi corti — e tutto il resto sta dentro ai blocchi che si aprono con un
  clic. Chi ha fretta legge dieci righe e ha finito; chi vuole i dettagli li
  trova dove se li aspetta, senza doverseli scorrere per forza.
-->
<main class="pagina-centro stretta guida">

  <h1 class="hero-t" data-t="g.titolo"></h1>
  <p class="guida-occhiello" data-t="g.riassunto"></p>

  <!-- ============ I TRE PASSI, CORTI ============ -->
  <section class="passo">
    <div class="passo-n">1</div>
    <div class="passo-corpo">
      <h2 data-t="g.p1"></h2>
      <p><a href="https://simkl.com/" target="_blank" rel="noopener">simkl.com</a> &rarr; <b>Sign up</b>.</p>
      <details class="pieghevole">
        <summary data-t="g.dettagli"></summary>
        <p data-t-html="g.p1d"></p>
        <p data-t="g.qualeSotto"></p>
        <div class="tabella">
          <div class="riga"><div class="cella-t">Simkl</div><div class="cella-d" data-t-html="g.simklD"></div></div>
          <div class="riga"><div class="cella-t">Trakt</div><div class="cella-d" data-t-html="g.traktD"></div></div>
          <div class="riga"><div class="cella-t">AniList</div><div class="cella-d" data-t-html="g.anilistD"></div></div>
        </div>
        <p><a href="https://simkl.com/apps/import/" target="_blank" rel="noopener">simkl.com/apps/import</a></p>
      </details>
    </div>
  </section>

  <section class="passo">
    <div class="passo-n">2</div>
    <div class="passo-corpo">
      <h2 data-t="g.p2"></h2>
      <p>
        <a href="https://simkl.com/apps/chrome/" target="_blank" rel="noopener">L'estensione per il browser</a>,
        o <a href="https://simkl.com/apps/mobile/" target="_blank" rel="noopener">l'app del telefono</a>.
      </p>
      <details class="pieghevole">
        <summary data-t="g.dettagli"></summary>
        <p data-t="g.p2d"></p>
        <h3 data-t="g.p2pc"></h3>
        <p data-t-html="g.p2pcD"></p>
        <h3 data-t="g.p2tel"></h3>
        <p data-t="g.p2telD"></p>
        <h3 data-t="g.p2media"></h3>
        <p data-t="g.p2mediaD"></p>
        <p>
          <a href="https://simkl.com/apps/plex/" target="_blank" rel="noopener">Plex</a> ·
          <a href="https://simkl.com/apps/kodi/" target="_blank" rel="noopener">Kodi</a> ·
          <a href="https://simkl.com/apps/emby/" target="_blank" rel="noopener">Emby</a> ·
          <a href="https://simkl.com/apps/jellyfin/" target="_blank" rel="noopener">Jellyfin</a>
        </p>
      </details>
    </div>
  </section>

  <section class="passo">
    <div class="passo-n">3</div>
    <div class="passo-corpo">
      <h2 data-t="g.p3"></h2>
      <button class="btn btn-big" id="btnCollega" data-t="home.collegaOra"></button>
      <details class="pieghevole">
        <summary data-t="g.dettagli"></summary>
        <p data-t-html="g.p3d"></p>
        <p class="nota" data-t="coll.durata"></p>
        <p class="nota" data-t="g.p3nota"></p>
      </details>
    </div>
  </section>

  <hr class="guida-riga">

  <!-- ============ IL RESTO, TUTTO PIEGATO ============ -->
  <h2 class="guida-h2" data-t="g.cosaVedi"></h2>

  <details class="pieghevole grande">
    <summary data-t="g.spaziT"></summary>
    <p data-t="g.spaziD"></p>
  </details>

  <details class="pieghevole grande">
    <summary data-t="g.leSezioni"></summary>
    <div class="tabella">
      <div class="riga"><div class="cella-t" data-t="sez.watch"></div><div class="cella-d" data-t="sez.watch.aiuto"></div></div>
      <div class="riga"><div class="cella-t" data-t="sez.inizia"></div><div class="cella-d" data-t="sez.inizia.aiuto"></div></div>
      <div class="riga"><div class="cella-t" data-t="sez.pausa"></div><div class="cella-d" data-t="sez.pausa.aiuto"></div></div>
      <div class="riga"><div class="cella-t" data-t="sez.scoprire"></div><div class="cella-d" data-t="sez.scoprire.aiuto"></div></div>
      <div class="riga"><div class="cella-t" data-t="sez.pari"></div><div class="cella-d" data-t="sez.pari.aiuto"></div></div>
      <div class="riga"><div class="cella-t" data-t="sez.archivio"></div><div class="cella-d" data-t="sez.archivio.aiuto"></div></div>
    </div>
  </details>

  <details class="pieghevole grande">
    <summary data-t="g.filmT"></summary>
    <p data-t-html="g.filmD"></p>
  </details>

  <details class="pieghevole grande">
    <summary data-t="g.seguitiT"></summary>
    <p data-t-html="g.seguitiD"></p>
  </details>

  <details class="pieghevole grande">
    <summary data-t="g.pastiglie"></summary>
    <div class="tabella">
      <div class="riga"><div class="cella-t"><span class="badge badge-new pos" data-t="bad.nuovo"></span></div><div class="cella-d" data-t="bad.nuovoAiuto"></div></div>
      <div class="riga"><div class="cella-t"><span class="badge badge-count pos">+7</span></div><div class="cella-d" data-t="bad.conteggio"></div></div>
      <div class="riga"><div class="cella-t"><span class="badge badge-info pos">&times;3</span></div><div class="cella-d" data-t="bad.quanteAiuto"></div></div>
      <div class="riga"><div class="cella-t"><span class="badge badge-back pos" data-t="bad.seguito"></span></div><div class="cella-d" data-t="bad.seguitoAiuto"></div></div>
      <div class="riga"><div class="cella-t"><span class="badge badge-back pos" data-t="bad.tornata"></span></div><div class="cella-d" data-t="bad.tornataAiuto"></div></div>
      <div class="riga"><div class="cella-t"><span class="badge badge-done pos">&#10003;</span></div><div class="cella-d" data-t="bad.fattoAiuto"></div></div>
      <div class="riga"><div class="cella-t"><span class="badge badge-soon pos" data-t="bad.esempioData"></span></div><div class="cella-d" data-t="bad.escoAiuto"></div></div>
    </div>
  </details>

  <details class="pieghevole grande">
    <summary data-t="g.soglie"></summary>
    <p data-t="imp.soglieSotto"></p>
    <div class="tabella">
      <div class="riga"><div class="cella-t">60</div><div class="cella-d" id="sogliaPausa"></div></div>
      <div class="riga"><div class="cella-t">90</div><div class="cella-d" id="sogliaCalda"></div></div>
      <div class="riga"><div class="cella-t">365</div><div class="cella-d" id="sogliaAbbandono"></div></div>
      <div class="riga"><div class="cella-t">45</div><div class="cella-d" id="sogliaTornata"></div></div>
    </div>
  </details>

  <hr class="guida-riga">

  <!-- ============ DOMANDE ============ -->
  <h2 class="guida-h2" data-t="g.domande"></h2>
  <details class="pieghevole"><summary data-t="g.q1"></summary><p data-t-html="g.q1d"></p></details>
  <details class="pieghevole"><summary data-t="g.q2"></summary><p data-t-html="g.q2d"></p></details>
  <details class="pieghevole"><summary data-t="g.q3"></summary><p data-t-html="g.q3d"></p></details>
  <details class="pieghevole"><summary data-t="g.q4"></summary><p data-t-html="g.q4d"></p></details>
  <details class="pieghevole"><summary data-t="g.q5"></summary><p data-t-html="g.q5d"></p></details>
  <details class="pieghevole"><summary data-t="g.q6"></summary><p data-t-html="g.q6d"></p></details>
  <details class="pieghevole"><summary data-t="g.q7"></summary><p data-t-html="g.q7d"></p></details>

  <p class="guida-fine">
    <a class="btn btn-big btn-largo" href="index.html" data-t="g.vaiAllaDash"></a>
  </p>

</main>

<script src="js/lingua.js?v=28"></script>
<script src="js/stato.js?v=28"></script>
<script src="js/fonti.js?v=28"></script>
<script src="js/regole.js?v=28"></script>
<script src="js/carte.js?v=28"></script>
<script src="js/telaio.js?v=28"></script>
<script>
/* La guida è una pagina di testo, ma il pulsante "collega" deve funzionare
   anche da qui: chi finisce di leggere è esattamente la persona pronta a farlo,
   e mandarla in un'altra pagina per premerlo era un passaggio di troppo. */
(function () {
  load();
  montaTelaio({ attiva: null });

  function riempi() {
    applicaLingua();
    document.getElementById('sogliaPausa').innerHTML = t('imp.pausa', { n: 60 });
    document.getElementById('sogliaCalda').innerHTML = t('imp.calda', { n: 90 });
    document.getElementById('sogliaAbbandono').innerHTML = t('imp.abbandono', { n: 365 });
    document.getElementById('sogliaTornata').innerHTML = t('imp.tornata', { n: 45 });
    document.title = t('nav.guida') + ' · ' + t('app.nome');
  }
  riempi();
  document.addEventListener('lingua-cambiata', riempi);

  document.getElementById('btnCollega').onclick = () =>
    apriCollegamento(() => { if (collegato()) location.href = 'index.html'; });
})();
</script>
</body>
</html>
