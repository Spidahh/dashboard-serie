<script src="js/lingua.js?v=22"></script>

<script>
/* La guida è una pagina di testo, ma il pulsante "collega" deve funzionare
   anche da qui: chi finisce di leggere è esattamente la persona pronta a farlo,
   e mandarla in un'altra pagina per premerlo era un passaggio di troppo. */
(function () {
  load();
  montaTelaio({ attiva: null });

  function riempi() {
    applicaLingua();
    document.getElementById('sogliaPausa').innerHTML = t('imp.pausa', { n: 60 });
    document.getElementById('sogliaCalda').innerHTML = t('imp.calda', { n: 90 });
    document.getElementById('sogliaAbbandono').innerHTML = t('imp.abbandono', { n: 365 });
    document.getElementById('sogliaTornata').innerHTML = t('imp.tornata', { n: 45 });
    document.title = t('nav.guida') + ' · ' + t('app.nome');
  }
  riempi();
  document.addEventListener('lingua-cambiata', riempi);

  document.getElementById('btnCollega').onclick = () =>
    apriCollegamento(() => { if (collegato()) location.href = 'index.html'; });
})();
</script>
